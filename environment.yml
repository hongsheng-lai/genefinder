# Conda/mamba environment for genefinder.
#   mamba env create -f environment.yml && conda activate genefinder
# (scripts/setup.sh creates the same environment under tools/env automatically if the tools are missing)
# Versions used for the reference run: samtools/htslib 1.24, impg 0.5.0, minimap2 2.31, python 3.11.
name: genefinder
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.9
  - samtools>=1.16   # remote faidx over HTTPS needs htslib with libcurl (bioconda builds have it)
  - htslib>=1.16     # bgzip
  - impg>=0.5.0
  - minimap2         # validation only
  - curl
