# genefinder conda environment (Linux/macOS):
#   conda env create -f environment.yml && conda activate genefinder
name: genefinder
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - samtools=1.24   # faidx on local or HTTPS bgzipped FASTA (bioconda build has libcurl)
  - htslib=1.24     # bgzip, tabix
