# Conda environment for genefinder (Linux and macOS, x86_64 and arm64):
#   conda env create -f environment.yml && conda activate genefinder
# Tools are pinned to the versions used for the reference run.
name: genefinder
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - samtools=1.24   # reads the remote assemblies over HTTPS (bioconda builds include libcurl)
  - htslib=1.24     # bgzip, tabix
  - curl
  - minimap2=2.31   # optional: scripts/validate.sh
  - impg=0.5.0      # optional: only for --mode impg (./run.sh --setup --full)
