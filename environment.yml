# Conda environment for genefinder (Linux and macOS, x86_64 and arm64):
#   conda env create -f environment.yml && conda activate genefinder
# Versions used for the reference run: samtools/htslib 1.24, impg 0.5.0, minimap2 2.31, python 3.11.
name: genefinder
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.9
  - samtools>=1.16   # reads the remote assemblies over HTTPS (bioconda builds include libcurl)
  - htslib>=1.16     # bgzip, tabix
  - curl
  - minimap2         # optional: scripts/validate.sh
  - impg>=0.5.0      # optional: only for --mode impg (./run.sh --setup --full)
